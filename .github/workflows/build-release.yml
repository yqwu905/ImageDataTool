name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core:
    name: Linux core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-linux
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x64 build and tests
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build, test and package portable executable
        shell: pwsh
        run: ./build-windows.ps1 -Configuration MinSizeRel -Package -Version $env:RELEASE_VERSION
      - name: Measure viewer performance against v1.0.0
        shell: pwsh
        run: |
          git fetch --depth=1 origin tag v1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch benchmark baseline' }
          New-Item -ItemType Directory -Force build/perf-baseline | Out-Null
          git archive --format=tar -o build/baseline.tar v1.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive benchmark baseline' }
          tar -xf build/baseline.tar -C build/perf-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract benchmark baseline' }
          $baseline = (Resolve-Path build/perf-baseline).Path.Replace('\', '/')
          cmake -S . -B build -DIMAGECOMPARE_BUILD_BENCHMARKS=ON "-DIMAGECOMPARE_BASELINE_DIR=$baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure performance harness' }
          cmake --build build --config MinSizeRel --target performance_benchmark performance_baseline --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build performance harness' }
          & ./build/MinSizeRel/performance_baseline.exe build/perf-fixtures build/performance-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline benchmark failed' }
          & ./build/MinSizeRel/performance_benchmark.exe build/perf-fixtures build/performance-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Updated benchmark failed' }
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ImageCompare-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-windows
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/performance-before.json
            build/performance-after.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ImageCompare-windows-x64
          path: dist
      - name: Verify checksums and publish tested packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh
